packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
  - protobufjs

# Install scripts we deliberately skip (swagger-ui-dist's telemetry ping).
ignoredBuiltDependencies:
  - '@scarf/scarf'
