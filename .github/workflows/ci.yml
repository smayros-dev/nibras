name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the `images` job widens it to push to GHCR.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  # Same layout as .env.example, against the job's service containers. Test-only credentials
  # (created by infra/docker/postgres/init.sql), not secrets. Every variable a test or build reads
  # must be listed here AND in turbo.json (strict env mode), or the task does not see it.
  # DATABASE_URL_TEST*/REDIS_URL_TEST are bases: each package derives nibras_<pkg>_test and its own
  # Redis index (packages/config/vitest/test-env.mjs). TEST_DB_PREFIX/TEST_REDIS_DB_BASE (turbo.json)
  # are left unset here: the defaults apply.
  DATABASE_URL: postgresql://app_user:app@localhost:5432/nibras
  DATABASE_URL_SYSTEM: postgresql://app_system:app@localhost:5432/nibras
  DATABASE_URL_TEST: postgresql://app_user:app@localhost:5432/nibras_test
  DATABASE_URL_TEST_SYSTEM: postgresql://app_system:app@localhost:5432/nibras_test
  DATABASE_URL_SHADOW: postgresql://app_system:app@localhost:5432/nibras_shadow
  REDIS_URL: redis://localhost:6379
  REDIS_URL_TEST: redis://localhost:6379/15
  WEB_ORIGIN: http://localhost:3000
  API_URL: http://localhost:3001
  PORT: '3001'
  WORKER_PORT: '3002'
  LOG_LEVEL: warn
  TRUST_PROXY_HOPS: '1'
  APP_ENV: development
  SMTP_URL: smtp://localhost:1025
  # SP1 auth settings: CI-only dummy values, not secrets.
  EMAIL_FROM: Nibras CI <no-reply@nibras.localhost>
  JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-0123456789
  TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0zMi1ieXRlcy1sb25nISE=
  SMS_PROVIDER: console
  HIBP_ENABLED: 'false'
  COOKIE_SECURE: 'false'
  # Global API rate limits: the same defaults as .env.example; the e2e job raises ANON.
  RATE_LIMIT_USER: '600'
  RATE_LIMIT_ANON: '60'
  # Superuser of the Postgres service, only used to apply init.sql.
  PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  check:
    name: check (lint, typecheck, test, build, contracts drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service containers start before checkout, so init.sql (roles + nibras, the per-package test DBs
      # nibras_db_test/nibras_api_test/nibras_worker_test and nibras_shadow) is applied here.
      - name: Initialise Postgres (roles and databases)
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate nibras
        run: pnpm --filter @nibras/db migrate:deploy
      - name: Migrate the test DBs (nibras_db_test, nibras_api_test, nibras_worker_test)
        run: pnpm db:migrate:test
      - run: pnpm test
      - run: pnpm build
      - name: First-load JS budget (PRD §14.1, < 250 kB gzip per route)
        run: pnpm --filter @nibras/web budget
      - name: OpenAPI contracts are up to date
        run: pnpm --filter @nibras/api openapi:export && pnpm --filter @nibras/contracts generate && git diff --exit-code packages/contracts

  windows-check:
    # Developers run Windows 11: scripts must not be Linux-only. No Docker services on this
    # runner, so only the DB/Redis-free packages run their tests here.
    name: windows-check (lint, typecheck, DB-free tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --filter=@nibras/config --filter=@nibras/contracts --filter=@nibras/i18n --filter=@nibras/ui

  migrate-check:
    # Fails when schema.prisma and prisma/migrations drift apart (a model change without a migration).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialise Postgres (roles and databases)
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql
      - run: pnpm --filter @nibras/db migrate:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright starts the built api/worker and the standalone web server itself
    # (`reuseExistingServer: false` under CI, apps/web/playwright.config.ts): the e2e runs against
    # the production build. The api's webServer env also carries these e2e-only overrides; they
    # are set here so every child process sees them: the bumped TERMS version (consent-gate
    # specs) and a raised anon rate limit (the suite registers many accounts from one ip).
    env:
      TEST_CONSENT_TERMS_VERSION: terms-e2e-2026-11
      RATE_LIMIT_ANON: '10000'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialise Postgres (roles and databases)
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql
      - run: pnpm --filter @nibras/db migrate:deploy
      # The api/worker dist and the web standalone output (`.next/standalone`) the e2e runs.
      - run: pnpm build
      - run: pnpm --filter @nibras/web exec playwright install --with-deps chromium
      - run: pnpm --filter @nibras/web e2e
      - name: App logs
        if: failure()
        run: tail -n 200 api.log worker.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      # Full-page screenshots of every axe-audited page per project (fr/ar, desktop/mobile) for
      # the RTL recette (e2e/a11y.spec.ts), kept on success too.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-screens
          path: apps/web/test-results/screens
          if-no-files-found: warn
          retention-days: 14

  images:
    # Only on a push to main (never on pull requests), after every gate is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, windows-check, migrate-check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR needs a lowercase owner)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nibras-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
