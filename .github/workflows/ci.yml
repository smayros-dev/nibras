name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the `images` job widens it to push to GHCR.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  # Same layout as .env.example, against the job's service containers. Test-only credentials
  # (created by infra/docker/postgres/init.sql), not secrets. Every variable a test or build reads
  # must be listed here AND in turbo.json (strict env mode), or the task does not see it.
  # DATABASE_URL_TEST*/REDIS_URL_TEST are bases: each package derives nibras_<pkg>_test and its own
  # Redis index (packages/config/vitest/test-env.mjs). TEST_DB_PREFIX/TEST_REDIS_DB_BASE (turbo.json)
  # are left unset here: the defaults apply.
  DATABASE_URL: postgresql://app_user:app@localhost:5432/nibras
  DATABASE_URL_SYSTEM: postgresql://app_system:app@localhost:5432/nibras
  DATABASE_URL_TEST: postgresql://app_user:app@localhost:5432/nibras_test
  DATABASE_URL_TEST_SYSTEM: postgresql://app_system:app@localhost:5432/nibras_test
  DATABASE_URL_SHADOW: postgresql://app_system:app@localhost:5432/nibras_shadow
  REDIS_URL: redis://localhost:6379
  REDIS_URL_TEST: redis://localhost:6379/15
  WEB_ORIGIN: http://localhost:3000
  API_URL: http://localhost:3001
  PORT: '3001'
  WORKER_PORT: '3002'
  LOG_LEVEL: warn
  TRUST_PROXY_HOPS: '1'
  APP_ENV: development
  SMTP_URL: smtp://localhost:1025
  # SP1 auth settings: CI-only dummy values, not secrets.
  EMAIL_FROM: Nibras CI <no-reply@nibras.localhost>
  JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-0123456789
  TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0zMi1ieXRlcy1sb25nISE=
  SMS_PROVIDER: console
  HIBP_ENABLED: 'false'
  COOKIE_SECURE: 'false'
  # Global API rate limits: the same defaults as .env.example; the e2e job raises ANON.
  RATE_LIMIT_USER: '600'
  RATE_LIMIT_ANON: '60'
  # Superuser of the Postgres service, only used to apply init.sql.
  PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  check:
    name: check (lint, typecheck, test, build, contracts drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # SP3 media (spec D10): the MinIO started below. Root credentials of the pinned image, not
      # secrets (refused outside development by assertDeployableEnv). S3_PUBLIC_ENDPOINT stays unset
      # (= S3_ENDPOINT). S3_BUCKET_TEST is a base: each package derives nibras-<pkg>-test.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: nibras-dev
      S3_BUCKET_TEST: nibras-test
      S3_FORCE_PATH_STYLE: 'true'
      VIDEO_PROVIDER: s3
      # Cloudflare Stream is never called in CI (VIDEO_PROVIDER=s3): empty = unset.
      CLOUDFLARE_ACCOUNT_ID: ''
      CLOUDFLARE_STREAM_API_TOKEN: ''
      CLOUDFLARE_STREAM_WEBHOOK_SECRET: ''
      CLOUDFLARE_STREAM_SIGNING_KEY_ID: ''
      CLOUDFLARE_STREAM_SIGNING_KEY_PEM: ''
      CLOUDFLARE_STREAM_CUSTOMER_SUBDOMAIN: ''
      # The web CSP's media origins (connect/media/img-src): the MinIO above, as browsers reach it.
      MEDIA_ORIGINS: http://localhost:9000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (pnpm version from package.json `packageManager`)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service containers start before checkout, so init.sql (roles + nibras, the per-package test DBs
      # nibras_db_test/nibras_api_test/nibras_worker_test and nibras_shadow) is applied here.
      - name: Initialise Postgres (roles and databases)
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate nibras
        run: pnpm --filter @nibras/db migrate:deploy
      - name: Migrate the test DBs (nibras_db_test, nibras_api_test, nibras_worker_test)
        run: pnpm db:migrate:test
      # Same image (and digest) as docker-compose.yml. Not a service container: those cannot take
      # the `server /data` command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy within 60 s" >&2
          docker logs minio
          exit 1
      - run: pnpm test
      - run: pnpm build
      - name: First-load JS budget (PRD §14.1, < 250 kB gzip per route)
        run: pnpm --filter @nibras/web budget
      - name: OpenAPI contracts are up to date
        run: pnpm --filter @nibras/api openapi:export && pnpm --filter @nibras/contracts generate && git diff --exit-code packages/contracts

  windows-check:
    # Developers run Windows 11: scripts must not be Linux-only. No Docker services on this
    # runner, so only the DB/Redis-free packages run their tests here; S3_ENDPOINT is unset, so
    # @nibras/providers skips its MinIO suite.
    name: windows-check (lint, typecheck, DB-free tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --filter=@nibras/config --filter=@nibras/contracts --filter=@nibras/i18n --filter=@nibras/ui --filter=@nibras/providers

  migrate-check:
    # Fails when schema.prisma and prisma/migrations drift apart (a model change without a migration).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialise Postgres (roles and databases)
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql
      - run: pnpm --filter @nibras/db migrate:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright starts the built api/worker and the standalone web server itself
    # (`reuseExistingServer: false` under CI, apps/web/playwright.config.ts): the e2e runs against
    # the production build. The api's webServer env also carries these e2e-only overrides; they
    # are set here so every child process sees them: the bumped TERMS version (consent-gate
    # specs) and a raised anon rate limit (the suite registers many accounts from one ip).
    env:
      TEST_CONSENT_TERMS_VERSION: terms-e2e-2026-11
      RATE_LIMIT_ANON: '10000'
      # SP3 media: same MinIO settings as the check job.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: nibras-dev
      S3_BUCKET_TEST: nibras-test
      S3_FORCE_PATH_STYLE: 'true'
      VIDEO_PROVIDER: s3
      # Cloudflare Stream is never called in CI (VIDEO_PROVIDER=s3): empty = unset.
      CLOUDFLARE_ACCOUNT_ID: ''
      CLOUDFLARE_STREAM_API_TOKEN: ''
      CLOUDFLARE_STREAM_WEBHOOK_SECRET: ''
      CLOUDFLARE_STREAM_SIGNING_KEY_ID: ''
      CLOUDFLARE_STREAM_SIGNING_KEY_PEM: ''
      CLOUDFLARE_STREAM_CUSTOMER_SUBDOMAIN: ''
      # The web CSP's media origins (connect/media/img-src): the MinIO above, as browsers reach it.
      MEDIA_ORIGINS: http://localhost:9000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialise Postgres (roles and databases)
        run: psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init.sql
      - run: pnpm --filter @nibras/db migrate:deploy
      # Same image (and digest) as docker-compose.yml. Not a service container: those cannot take
      # the `server /data` command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy within 60 s" >&2
          docker logs minio
          exit 1
      # The api/worker dist and the web standalone output (`.next/standalone`) the e2e runs.
      - run: pnpm build
      - run: pnpm --filter @nibras/web exec playwright install --with-deps chromium
      - run: pnpm --filter @nibras/web e2e
      - name: App logs
        if: failure()
        run: tail -n 200 api.log worker.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      # Full-page screenshots of every axe-audited page per project (fr/ar, desktop/mobile) for
      # the RTL recette (e2e/a11y.spec.ts), kept on success too.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rtl-screens
          path: apps/web/test-results/screens
          if-no-files-found: warn
          retention-days: 14

  images:
    # Only on a push to main (never on pull requests), after every gate is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, windows-check, migrate-check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Image name (GHCR needs a lowercase owner)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nibras-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the local daemon first and gate it (SP1.6 F11): a fat image, or one carrying
      # sources or build tooling, never reaches GHCR. Same cache scope as the push build below,
      # which is then a cache hit.
      - name: Build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          load: true
          push: false
          tags: local/nibras-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Verify image
        run: bash infra/docker/verify-image.sh local/nibras-${{ matrix.app }}:ci ${{ matrix.app }}
      # SP1.6 F10: an image with a fixable HIGH/CRITICAL vulnerability never reaches GHCR.
      # Accepted findings go to .trivyignore with a reason (runbook: local-dev.md, "Security scans").
      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: local/nibras-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          # The vulnerability DB is restored by date with actions/cache (inside the action), kept
          # outside the workspace so it never enters the docker build context of the push below.
          cache: 'true'
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
