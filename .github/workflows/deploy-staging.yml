name: Deploy staging

# Runs after CI completes on a push to main. CI's `images` job only runs (and CI only succeeds)
# when every gate passed and the three images were pushed to GHCR with the commit SHA tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Secrets are not readable in a job-level `if`, so the switch is a repository variable
    # (Settings > Variables: STAGING_DEPLOY_ENABLED=true); the first step then checks the secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      STAGING_DIR: ${{ vars.STAGING_DIR || '/opt/nibras' }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          # SHA256 host-key fingerprint (SP1.6 F4): without it the job never deploys, it skips
          # with a notice (owner Q4) — see docs/runbooks/staging.md.
          STAGING_SSH_FINGERPRINT: ${{ secrets.STAGING_SSH_FINGERPRINT }}
        run: |
          ready=true
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_SSH_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name not set: staging deploy skipped."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Image owner (lowercase for GHCR)
        if: steps.secrets.outputs.ready == 'true'
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Ships the compose file and the Postgres init script; `.env.staging` stays on the host.
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          source: infra/compose.staging.yml,infra/docker/postgres/init-staging.sh
          target: ${{ env.STAGING_DIR }}
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        if: steps.secrets.outputs.ready == 'true'
        env:
          NIBRAS_IMAGE_OWNER: ${{ steps.owner.outputs.name }}
          NIBRAS_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          envs: NIBRAS_IMAGE_OWNER,NIBRAS_IMAGE_TAG,GHCR_USER,GHCR_TOKEN,STAGING_DIR
          script: |
            set -eu
            cd "$STAGING_DIR/infra"
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            export NIBRAS_IMAGE_OWNER NIBRAS_IMAGE_TAG
            # Record the deployed tag (rollback = previous line of this file).
            echo "$(date -u +%FT%TZ) $NIBRAS_IMAGE_TAG" >> deployed-tags.log
            docker compose --env-file .env.staging -f compose.staging.yml pull
            docker compose --env-file .env.staging -f compose.staging.yml up -d --remove-orphans
